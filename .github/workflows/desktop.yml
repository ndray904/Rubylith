# Builds the Windows installer (desktop/) on a Windows machine and attaches it to a GitHub Release.
# Runs when a tag like desktop-v1.0.0 is pushed, or by hand from the Actions tab.
name: Windows app

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install build tools
        working-directory: desktop
        run: npm ci
      - name: Build the installer
        working-directory: desktop
        run: npm run dist
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/dist/Rubylith-Setup-*.exe \
            --title "Rubylith for Windows ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Download **Rubylith-Setup-${GITHUB_REF_NAME#desktop-v}.exe** below and run it. Both AI models are built in; no Python, internet or other setup needed. Windows may show a SmartScreen warning because the installer isn't code-signed: choose **More info → Run anyway**."
      - name: Keep the installer (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Rubylith-Setup
          path: desktop/dist/Rubylith-Setup-*.exe
